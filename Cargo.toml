[package]
name = "openai-paired-trader"
version = "0.2.0-rc.3"
edition = "2024"

[features]
default = ["openai-inventory-live"]
openai-inventory-live = []
paper-runtime = []

[[bin]]
name = "openai-paired-trader"
path = "src/main.rs"
required-features = ["openai-inventory-live"]

[[bin]]
name = "paired-paper"
path = "src/bin/paired-paper.rs"
required-features = ["paper-runtime"]

[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ethers = "2"
flate2 = "=1.1.9"
futures-util = "0.3"
hyperliquid_rust_sdk = "0.6"
nautilus-lighter = { package = "lighter-signing", path = "vendor/lighter-signing" }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v5"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zeroize = { version = "1", features = ["derive"] }

[patch.crates-io]
hyperliquid_rust_sdk = { path = "vendor/hyperliquid_rust_sdk" }

[workspace]
members = ["vendor/lighter-signing"]
exclude = ["vendor/hyperliquid_rust_sdk"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
