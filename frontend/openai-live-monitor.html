<!doctype html>
<html lang="zh-CN" data-openai-mode="live"><head>
<meta charset="utf-8"><link rel="icon" href="/assets/brand-glass.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cross-Platform Arbitrage · OPENAI 实盘监控</title>
<link rel="stylesheet" href="/assets/phosphor/style.css"><link rel="stylesheet" href="/assets/control-center.css"><link rel="stylesheet" href="/assets/monitor.css">
</head><body><main class="console-shell monitor-shell">
<header class="brand-bar"><a id="monitor-brand" class="brand" href="/accounts"><img src="/assets/brand-glass.png" alt="" width="62" height="62"><span><strong>多平台套利</strong><small>Cross-Platform Arbitrage</small></span></a><div class="header-actions"><a id="account-management-link" class="button" href="/accounts"><i class="ph ph-users" aria-hidden="true"></i>账户管理</a><a id="control-link" class="button primary" href="/"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i>控制中心</a></div></header>
<div class="page-heading"><div><h1>实盘监控</h1><p class="muted" id="monitor-account">OPENAI 实盘监控</p></div><nav id="account-tabs" class="account-tabs" aria-label="账户切换"><span class="muted">正在读取账户…</span></nav></div>
<div id="monitor-error" class="connection-alert" role="alert" hidden></div>
<section class="glass monitor-health" aria-label="账户状态"><div class="monitor-health-main"><span id="monitor-state" class="badge">读取中</span><span id="monitor-pair-status" class="muted">正在核对账户与持仓…</span></div><span id="mode-tag" class="badge">检查中</span><span id="updated">等待更新</span></section>
<section aria-label="收益概览"><div id="status-metrics"></div></section>
<div id="monitor-warning" class="connection-alert" hidden><strong id="monitor-warning-title"></strong><details><summary>查看异常详情</summary><pre id="monitor-reason"></pre></details></div>
<div id="comparison" class="market-layout">
<section id="comparison-chart-panel" class="glass"><div class="section-heading"><div><h2><i class="ph ph-chart-line-up" aria-hidden="true"></i>价差走势</h2><p class="muted">最近 8 小时 · 盘口第一档 · U / 份</p></div><span id="comparison-chart-note" class="badge"></span></div><div id="comparison-candles" aria-live="off"></div><p id="comparison-chart-status" class="muted">等待有效行情</p><p id="comparison-chart-hover" class="muted"></p></section>
<aside class="market-quotes" aria-label="两平台买卖价"><table class="quote-table"><caption class="visually-hidden">两平台买卖价</caption><thead class="visually-hidden"><tr><th>平台 / 标的</th><th>可买入价</th><th>可卖出价</th><th>报价更新</th></tr></thead><tbody id="comparison-quotes"></tbody></table></aside>
</div>
<div id="inventory-tables"></div>
<footer class="glass monitor-footer"><p id="status-line">正在连接实盘策略…</p><details><summary>程序版本</summary><p id="build-identity"></p></details></footer>
</main>
<script src="/assets/glass-ui.js"></script><script src="/assets/monitor-shell.js"></script>
<script src="/assets/openai-market-visuals.js"></script><script src="/assets/inventory-components.js"></script>
<script>
/*PROFILE_CONFIG*/
const profile=window.InventoryProfile||{market:"openai",mode:"live",quantityDecimals:4,api:"/api/openai-inventory",symbols:["OPENAI","io:OAI"]};
const $=id=>document.getElementById(id);
if(window.MonitorUI)window.MonitorUI.mount(profile,window.InventoryProfiles||[]);
const components=window.InventoryComponents.create(profile,$);
components.mount();
const n=value=>Number(value);
const money=value=>Number.isFinite(n(value))?n(value).toFixed(2):'—';
function marketPayload(view){
  const books=(view.books||[]).map(b=>({bid:b.bids?.[0]?{price:b.bids[0].price}:null,ask:b.asks?.[0]?{price:b.asks[0].price}:null,connected:b.connected,received_ms:b.received_ms}));
  return {symbols:profile.symbols,available:true,status:{books,running:true,started_ms:view.snapshot.created_ms,observed_ms:Date.now()},rules:{book_max_age_ms:view.snapshot.config.book_max_age_ms},chart_points:view.chart_points||[]};
}
function render(payload){
  if(!payload.ok||!payload.view){throw new Error(payload.ok?'策略尚未启动':payload.error||'连接失败')}
  if(payload.view.snapshot?.config?.mode!==profile.mode||(payload.view.snapshot?.config?.market||'openai')!==profile.market||(profile.mode==='live'&&(!payload.live_build||payload.process_dry_run))||(profile.mode==='paper'&&(!payload.paper_build||!payload.process_dry_run||payload.live_build))){throw new Error('页面与账户标的或运行模式不匹配')}
  if(profile.id&&payload.profile?.id!==profile.id){throw new Error('页面与账户不匹配')}
  const v=payload.view;
  const b=payload.build;$('build-identity').textContent=b?`程序 ${b.version} · 核心 ${b.strategy_core_sha256.slice(0,12)} · 参数 ${(payload.rules_fingerprint||'未加载').slice(0,12)}${b.dirty?' · 开发版本':''}`:'核心版本：旧版未提供';
  $('mode-tag').textContent=profile.mode==='paper'?'模拟账户 · 虚拟资金':'真实账户 · 只读';$('mode-tag').className='badge';$('updated').textContent=`更新于 ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;
  $('status-line').textContent=`5 秒双次确认 · 逐组止盈 · 两边逐仓 3 倍${profile.mode==='paper'?' · 模拟成交与资金费估算':''}`;
  components.render(v);
  if(window.MonitorUI)window.MonitorUI.render(payload);
  const market=marketPayload(v),visuals=window.OpenaiMarketVisuals;
  visuals.renderCharts(market,$);
  const direction=visuals.displayDirection(market);
  const mean=v.directional_means?.[direction==='shortL'?1:0];
  $('comparison-chart-note').textContent=`MA5m ${mean==null?'—':money(mean)+' U'}`;
  visuals.renderQuoteCards(visuals.quoteRows(market,Date.now(),true),direction,$);
}
async function refresh(){try{const r=await fetch(profile.api,{cache:'no-store'});const response=await r.json();render(response.ok?{ok:true,...response.data}:{ok:false,error:response.error})}catch(error){if(window.MonitorUI)window.MonitorUI.disconnected(error.message);$('groups').textContent='—';$('pnl').textContent='—';$('pnl').className='';$('closed-pnl').textContent='—';$('closed-pnl').className='';$('mode-tag').textContent='状态待核对';$('mode-tag').className='badge warn'}}
refresh();setInterval(refresh,2000);
</script>

</body></html>
