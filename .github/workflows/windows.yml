name: Shared core - Mac and Windows
on:
  push:
    branches: [main, windows-portable, feature/anth-paper]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set exact Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.platform }}-rust-1.98.1-static-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-rust-1.98.1-static-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-
            ${{ matrix.platform }}-rust-1.98.1-static-
      - name: Shared source boundaries and frontend regressions
        run: |
          node scripts/check-shared-core.cjs
          node --test tests/*.test.cjs
      - name: Live core and signer regressions - synthetic evidence only
        env:
          STRATEGY_PARITY_REPORT: artifacts/parity-live.json
        run: cargo test --locked --release --workspace --lib --target ${{ matrix.target }}
      - name: Paper core and isolation regressions - synthetic evidence only
        env:
          STRATEGY_PARITY_REPORT: artifacts/parity-paper.json
        run: cargo test --locked --release --no-default-features --features paper-runtime --lib --target ${{ matrix.target }}
      - name: Build Windows live binary
        if: matrix.platform == 'windows'
        run: cargo build --locked --release --target ${{ matrix.target }} --bin openai-paired-trader
      - name: Package and smoke test Windows binary without credentials
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Exe target/x86_64-pc-windows-msvc/release/openai-paired-trader.exe
          ./scripts/smoke-windows.ps1 -Exe dist/OPENAI-Trader-Windows-x64/OPENAI-Trader.exe
      - name: Build and package Mac paper binary without starting it
        if: matrix.platform == 'macos'
        run: |
          cargo build --locked --release --no-default-features --features paper-runtime --target ${{ matrix.target }} --bin paired-paper
          bash scripts/package-macos.sh target/aarch64-apple-darwin/release/paired-paper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.platform }}
          path: |
            artifacts/parity-*.json
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/*/build-info.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  verify-pair:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-*
          path: artifacts
      - name: Require identical core, rules and decision traces on both operating systems
        run: node scripts/verify-core-parity.cjs artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-mac-windows
          path: |
            artifacts/shared-core-verification.json
            artifacts/candidate-*/dist/*.zip
            artifacts/candidate-*/dist/SHA256SUMS.txt
            artifacts/candidate-*/dist/*/build-info.json
            artifacts/candidate-*/artifacts/parity-*.json
          if-no-files-found: error
          retention-days: 30
